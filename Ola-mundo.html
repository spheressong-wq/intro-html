    <!-- DOCTYPE serve para indicar para o navegador qual a versão e o padrão de HTML que sera usado -->
<!DOCTYPE html>

    <!-- HTML, o elemento raiz. Tudo o que pertence ao documento HTML fica dentro dele
 
    <!-- Lang/language (idioma) = atributo responsável por definir a linguagem e o conteúdo do site. Impotante para indicar acessibilidade também, e SEO -->
<html lang="pt-br">


<head>

    <!-- Charset (character, set) = Essa configuração serve para indicar ao navegador qual padrão/codificação de caracteres usar. Isso permite utilizar palavras com acentos, caracteres espexciais, e emojis.  -->
    <meta charset="UTF-8">

    <!-- Viewport ("porta de visualização") = indica como encaixar o ecrã inteiro da tela, desde as bordas de baixo do pc até a parte de cima das abas dos navegadores. Também indica o zoom da tela (initial scale), além de igualar ao tamanho do dispositivo usado (width device = largura do sipositivo)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title/titulo = representa o titulo que aparece na tela do navegador para o usuario -->
    <title> Aqui é o titulo da aba la de cima </title>
</head>

    <!-- "body" é o corpo, que vai ser onde o usuário vai visualizar e interagir com os conteúdos. Ele contém textos, imagens, ícones, botões, vídeos... Também é a parte que você vai passar a maior parte do tempo programando. EAnquanto (header = conf. da página) body (conteúdo da página)-->
<body>
    Olá, Mundo. Este é o meu primeiro programa em HTML. 
</body>

</html>

<!-- No HTML, o que é o hipertexto? é basicamente um texto que, quando você clicar, vai te direcionar para outro lugar. Se não te mandar pra outro lugar (outra página de livro), é mais um texto. O hipertexto cria um link entre várias dessas páginas. -->
